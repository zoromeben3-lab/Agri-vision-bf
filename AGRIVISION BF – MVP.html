<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>AGRIVISION BF – MVP</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f1f4ec;--card:#fff;--ink:#18271e;--mut:#5b6a60;--g:#2d6a3e;--gold:#b9801a;--red:#b3261e;--line:#d8dfd2;--gl:#e3efe4}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1913;--card:#16231b;--ink:#e8efe9;--mut:#9db0a3;--g:#6fbf84;--gold:#e0b04a;--red:#f08a80;--line:#2a3a30;--gl:#1d3426}}
:root[data-theme="dark"]{--bg:#0f1913;--card:#16231b;--ink:#e8efe9;--mut:#9db0a3;--g:#6fbf84;--gold:#e0b04a;--red:#f08a80;--line:#2a3a30;--gl:#1d3426}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Bricolage Grotesque",system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 18px;background:var(--g);color:#fff}
:root:not([data-theme="light"]) header{}
header h1{margin:0;font-size:20px;letter-spacing:.2px}header small{display:block;opacity:.85;font-size:13px}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,input,button,textarea{font:inherit;color:inherit}
select,input,textarea{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
header select{width:auto;color:var(--ink)}
button{border:0;border-radius:8px;padding:9px 14px;background:var(--g);color:#fff;cursor:pointer;font-weight:600}
:root[data-theme="dark"] button{color:#0f1913}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button{color:#0f1913}}
button.alt{background:transparent;color:var(--g);border:1px solid var(--g)}
button.sm{padding:5px 10px;font-size:14px}
button:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.net{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.5)}
.net.off{background:var(--gold);color:#1a1200;border-color:var(--gold)}
nav{display:flex;gap:4px;overflow-x:auto;padding:0 12px;background:var(--card);border-bottom:1px solid var(--line)}
nav button{background:none;color:var(--mut);border-radius:0;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:var(--g);border-color:var(--g)}
main{max-width:1000px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
h2{margin:0 0 10px;font-size:18px}h3{margin:14px 0 6px;font-size:15px;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
label{font-size:13px;color:var(--mut);display:block}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi b{display:block;font-size:26px;line-height:1.1}.kpi span{font-size:13px;color:var(--mut)}
.bar{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:14px}.bar i{display:block;height:14px;border-radius:4px;background:var(--g)}.bar i.p{background:var(--gold)}
.bar em{width:62px;font-style:normal;flex:none}
table{width:100%;border-collapse:collapse;font-size:14px}
.tw{overflow-x:auto}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}th{color:var(--mut);font-weight:600}
.b{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;background:var(--gl);color:var(--g)}
.b.w{background:#f6e6c4;color:#6b4800}.b.r{background:#f7d9d6;color:#8a1a13}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .b.w{background:#4a3a12;color:#f0cf80}:root:not([data-theme="light"]) .b.r{background:#4d1f1b;color:#f5b3ab}}
.note{background:var(--gl);border-left:4px solid var(--g);padding:10px 12px;border-radius:6px;margin:0 0 16px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.lot{display:flex;gap:14px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding:10px 0}
.lot svg{width:84px;height:84px;background:#fff;padding:4px;border-radius:6px}
.login{max-width:440px;margin:24px auto}.login form{display:grid;gap:10px}#who{font-size:14px}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
footer{text-align:center;color:var(--mut);font-size:13px;padding:8px 16px 28px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div><h1>AGRIVISION BF</h1><small>Observatoire agricole national · MVP de démonstration</small></div>
  <div class="ctl">
    <span id="who"></span><button id="out" class="net" type="button" onclick="logout()">Déconnexion</button>
    <button id="net" class="net" type="button"></button>
  </div>
</header>
<nav id="nav" aria-label="Sections"></nav>
<main id="main"></main>
<footer>Données de démonstration stockées localement dans ce navigateur. <button class="alt sm" type="button" onclick="resetAll()">Réinitialiser la démo</button></footer>
<div id="toast" role="status" aria-live="polite"></div>
<script>
const K='agrivision.mvp.4';
const ROLES={
 agent:{n:'Agent de terrain',who:'Agent A. Sawadogo',tabs:[['collecte','Collecte'],['lots','Campagne et lots'],['dist','Distribution'],['journal','Historique']]},
 reg:{n:'Responsable régional',who:'Resp. Hauts-Bassins',tabs:[['reg','Tableau régional'],['prod','Producteurs'],['alloc','Allocation d’engrais'],['alertes','Alertes'],['journal','Historique']]},
 nat:{n:'Niveau national',who:'Cellule nationale',tabs:[['nat','Tableau national'],['journal','Historique']]}};
const CUL=['Maïs','Sorgho','Coton','Mil','Riz'];
const REF={Maïs:[600,3500],Sorgho:[300,1800],Coton:[500,2000],Mil:[300,1200],Riz:[800,4500]};
const TYP={Maïs:1800,Sorgho:1000,Coton:1100,Mil:800,Riz:2500};
const SIM=[['Boucle du Mouhoun',1240,6100,5400],['Centre-Ouest',980,4300,3900],['Cascades',760,3900,3100],['Est',690,3200,2300]];
const NOMS=['Ouédraogo','Traoré','Sawadogo','Ouattara','Kaboré','Sanou','Zongo','Compaoré','Bambara','Konaté','Coulibaly','Sankara'];
const PRE=['Adama','Fatoumata','Issa','Aminata','Moussa','Salif','Awa','Boureima','Mariam','Seydou','Rasmata','Lassina'];
const USERS=[
{id:'agent.sawadogo',name:'Agent A. Sawadogo',role:'agent',zone:'Koumbia',h:'81c7e29e1f8df56d845a22050cd9f630bb9d64812a95a7f4d028a544161cdb90'},
{id:'agent.traore',name:'Agent M. Traoré',role:'agent',zone:'Karangasso-Vigué',h:'267da70e943c9e88f73b80a8bdbd0bdd1f5612e1efed0e02d80b6bd9c492d804'},
{id:'resp.hautsbassins',name:'Resp. Hauts-Bassins',role:'reg',zone:null,h:'83f3980fa07166a0f32fe26750ddab7ef6185545deee05906a5f7ea706054f23'},
{id:'national',name:'Cellule nationale',role:'nat',zone:null,h:'5ce55d4f84708d8d58ab69b8a91e8b859d5fc362bb36ba539c9521d64c5b8c3e'}];
const cur=()=>USERS.find(u=>u.id==S.user);
const mine=()=>{const u=cur();return u&&u.role=='agent'?S.P.filter(p=>p.z==u.zone):S.P};
const mineL=()=>{const ids=new Set(mine().map(p=>p.id));return S.L.filter(l=>ids.has(l.pid))};
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function login(e){e.preventDefault();const f=e.target,id=f.u.value.trim().toLowerCase(),u=USERS.find(x=>x.id==id);
 S.lock=S.lock||{};S.fail=S.fail||{};
 if(S.lock[id]>Date.now()){toast('Compte verrouillé. Réessayez dans '+Math.ceil((S.lock[id]-Date.now())/1000)+' s.');return}
 let h;try{h=await sha(id+':'+f.p.value)}catch(x){toast('Navigateur non compatible (chiffrement indisponible).');return}
 if(!u||u.h!=h){S.fail[id]=(S.fail[id]||0)+1;S.Jr.unshift({t:new Date().toISOString(),who:id||'?',u:id,act:'CONNEXION ÉCHEC',det:'Tentative '+S.fail[id]+'/3'});
  if(S.fail[id]>=3){S.lock[id]=Date.now()+30000;S.fail[id]=0;toast('Trois échecs : compte verrouillé 30 secondes.')}else toast('Identifiant ou mot de passe incorrect.');save();return}
 S.fail[id]=0;S.user=u.id;S.role=u.role;S.tab=ROLES[u.role].tabs[0][0];log('CONNEXION','Connexion réussie · '+ROLES[u.role].n);save();render()}
function logout(){go(()=>{log('DÉCONNEXION','Fin de session');S.user=null;S.role=null})}
function fill(id){$('#u').value=id;$('#p').value='Faso2026'}
/* Référentiel territorial de démonstration (villages fictifs à remplacer par le référentiel officiel) */
const TERR={Houet:{'Karangasso-Vigué':['Karangasso-centre','Karangasso-Ouest']},Tuy:{Koumbia:['Koumbia-centre','Koumbia-Nord','Koumbia-Est']}};
const prov=c=>Object.keys(TERR).find(p=>TERR[p][c])||'?';
const DIF=['Aucune','Pénurie d’engrais','Pluies insuffisantes ou en retard','Inondation','Ravageurs ou maladies','Manque de tracteur','Insécurité ou déplacement'];
const PL={Maïs:300,Sorgho:150,Coton:250,Mil:100,Riz:300}; /* plafonds indicatifs d'engrais (kg/ha) : à remplacer par les références agronomiques officielles */
const now=()=>new Date().toISOString();
const hist=(p,act,det)=>p.h.push({t:now(),who:cur().name,act,det});
const nw=o=>({...o,hr:null,kg:null,d:null,di:0,z:cur().zone,by:S.user,t:now(),h:[{t:now(),who:cur().name,act:'CRÉATION',det:'Recensement'}],srv:null});
const held=p=>S.A.some(a=>a.pid==p.id&&a.ty=='besoin'&&a.st!='Vérifiée');
const aname=id=>(USERS.find(u=>u.id==id)||{name:'?'}).name;
let S;
const $=s=>document.querySelector(s);
const fmt=n=>Math.round(n).toLocaleString('fr-FR');
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const core=p=>({id:p.id,nom:p.nom,c:p.c,hp:p.hp,e:p.e,l:p.l,hr:p.hr,kg:p.kg,z:p.z,d:p.d,di:p.di,v:p.v});
const lcore=l=>({id:l.id,pid:l.pid,q:l.q,d:l.d,mv:l.mv});
const J=o=>JSON.stringify(o);
const dirtyP=p=>J(core(p))!==J(p.srv);
const dirtyL=l=>J(lcore(l))!==J(l.srv);
const pend=()=>mine().filter(dirtyP).length+mineL().filter(dirtyL).length;
function load(){try{const r=localStorage.getItem(K);if(r)return JSON.parse(r)}catch(e){}
 return{role:null,user:null,tab:'',online:false,P:[],L:[],A:[],Jr:[],msg:''}}
function save(){try{localStorage.setItem(K,J(S))}catch(e){}}
function log(act,det){S.Jr.unshift({t:new Date().toISOString(),who:cur()?cur().name:'—',u:S.user,act,det})}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),3200)}
function go(fn){fn();save();render()}
function resetAll(){if(confirm('Effacer toutes les données de démonstration ?')){try{localStorage.removeItem(K)}catch(e){}S=load();render()}}

/* ---------- Synchronisation et contrôles de cohérence ---------- */
function sync(){
 if(!S.online){toast('Hors-ligne : '+pend()+' enregistrement(s) conservés sur le terminal.');return 0}
 let n=0,rej=0;
 mine().filter(dirtyP).forEach(p=>{if(!p.nom||!(p.hp>0)||(p.hr!=null&&p.hr<0)){rej++;return}p.srv=core(p);n++});
 mineL().filter(dirtyL).forEach(l=>{const p=S.P.find(x=>x.id==l.pid);
  if(!p||!p.srv||l.d<0||l.d>l.q||l.q>p.srv.kg){rej++;return}l.srv=JSON.parse(J(lcore(l)));n++});
 if(n||rej)log('SYNCHRONISATION',n+' enregistrement(s) validés par le serveur'+(rej?', '+rej+' rejeté(s)':''));
 let na=0;const add=(p,ty,msg)=>{if(!S.A.some(a=>a.pid==p.id&&a.ty==ty)){S.A.push({id:uid(),pid:p.id,ty,msg,st:'À vérifier',just:''});na++}};
 const seen={};
 S.P.filter(p=>p.srv).forEach(p=>{const q=p.srv,k=(q.nom+'|'+q.z).toLowerCase();
  if(seen[k])add(p,'doublon','Doublon possible avec un autre enregistrement (même nom, même zone).');else seen[k]=p;
  if(q.e>q.hp*PL[q.c]*1.2)add(p,'besoin','Besoin en engrais de '+fmt(q.e)+' kg pour '+q.hp+' ha de '+q.c+' : au-delà de 120 % du plafond indicatif ('+PL[q.c]+' kg/ha).');
  if(q.kg!=null){const y=q.kg/q.hr,r=REF[q.c];
   if(q.hr>q.hp*1.5)add(p,'sup','Superficie réelle ('+q.hr+' ha) très supérieure à la superficie prévue ('+q.hp+' ha).');
   else if(y>r[1]||y<r[0])add(p,'rend','Rendement de '+fmt(y)+' kg/ha pour '+q.c+' hors de la plage habituelle ('+r[0]+'–'+r[1]+').')}});
 if(na)log('ALERTE',na+' incohérence(s) détectée(s), vérification humaine requise');
 save();
 toast(n?n+' enregistrement(s) synchronisés'+(na?' · '+na+' alerte(s) créée(s)':''):(rej?rej+' rejeté(s) par le serveur':'Rien à synchroniser'));
 return n}

/* ---------- Actions terrain ---------- */
function addProd(e){e.preventDefault();const f=e.target,v=k=>f[k].value;
 const p=nw({id:uid(),nom:v('nom').trim(),v:v('v'),c:v('c'),hp:+v('hp'),e:+v('e')||0,l:+v('l')||0,});
 if(!p.nom||!(p.hp>0)){toast('Nom et superficie prévue (> 0) obligatoires.');return}
 go(()=>{S.P.push(p);log('CRÉATION','Producteur '+p.nom+' · '+p.c+' · '+p.hp+' ha')});
 toast('Producteur enregistré sur le terminal'+(S.online?'':' (hors-ligne)'));}
function demo100(){go(()=>{const VIL=TERR[prov(cur().zone)][cur().zone];for(let i=0;i<100;i++){const hp=i%2?6:4,c=CUL[i%5];
 S.P.push(nw({id:uid(),nom:PRE[i%12]+' '+NOMS[(i*7+Math.floor(i/12))%12],c,hp,e:hp*100,l:i%2?hp:0,v:VIL[i%VIL.length]}))}
 log('CRÉATION','Recensement hors-ligne de 100 producteurs (500 ha prévus)')});
 toast('100 producteurs saisis sur le terminal. Rétablissez la connexion pour synchroniser.')}
function demoCampagne(){let n=0;go(()=>{mine().filter(p=>p.kg==null).forEach((p,i)=>{
 p.hr=+(p.hp*(0.92+(i%5)*0.04)).toFixed(1);p.kg=Math.round(p.hr*TYP[p.c]*(0.85+(i%7)*0.05));p.d=DIF[i%9<DIF.length?i%9:0];hist(p,'MISE À JOUR','Résultat de campagne saisi');n++});
 log('MISE À JOUR',n+' résultats de campagne saisis (superficies réelles et production)')});toast(n+' résultats saisis')}
function incoh(){const p=mine().find(x=>x.kg!=null&&!S.A.some(a=>a.pid==x.id));
 if(!p){toast("Saisissez d'abord des résultats de campagne.");return}
 go(()=>{p.hr=p.hp;p.kg=Math.round(p.hp*REF[p.c][1]*2.4);log('MISE À JOUR','Donnée volontairement incohérente pour '+p.nom)});
 toast('Incohérence injectée pour '+p.nom+'. Synchronisez pour lancer le contrôle.')}
function addRes(e){e.preventDefault();const f=e.target,p=S.P.find(x=>x.id==f.pid.value);if(!p)return;
 const hr=+f.hr.value,kg=+f.kg.value;if(!(hr>0)||!(kg>=0)){toast('Superficie réelle et production à renseigner.');return}
 go(()=>{p.hr=hr;p.kg=kg;p.d=f.d.value;hist(p,'MISE À JOUR',hr+' ha, '+fmt(kg)+' kg · difficulté : '+p.d);log('MISE À JOUR','Résultat '+p.nom+' : '+hr+' ha, '+fmt(kg)+' kg')})}
function addLot(e){e.preventDefault();const f=e.target,p=S.P.find(x=>x.id==f.pid.value);if(!p)return;const q=+f.q.value;
 const used=S.L.filter(l=>l.pid==p.id).reduce((s,l)=>s+l.q,0);
 if(!(q>0)||q>p.kg-used){toast('Quantité invalide : '+fmt(Math.max(0,p.kg-used))+' kg encore disponibles pour ce producteur.');return}
 go(()=>{const l={id:'LOT-'+uid().slice(0,6).toUpperCase(),pid:p.id,q,d:q,mv:[{t:new Date().toISOString(),type:'Création',qte:q}],srv:null};
 S.L.push(l);log('CRÉATION','Lot '+l.id+' · '+fmt(q)+' kg · '+p.nom)})}
function sell(id){const l=S.L.find(x=>x.id==id),q=+$('#s'+id).value;
 if(!(q>0)||q>l.d){toast('Quantité indisponible : '+fmt(l.d)+' kg restants dans ce lot.');return}
 go(()=>{l.d-=q;l.mv.push({t:new Date().toISOString(),type:'Vente simulée',qte:-q});log('MOUVEMENT','Lot '+id+' : vente simulée de '+fmt(q)+' kg')})}
function justify(id){const a=S.A.find(x=>x.id==id),t=$('#j'+id).value.trim();if(!t){toast('Saisissez une justification.');return}
 go(()=>{a.just=t;a.st='Justifiée';log('JUSTIFICATION','Alerte '+id+' justifiée par l’agent')})}
function setAlert(id,st){const a=S.A.find(x=>x.id==id);go(()=>{a.st=st;log('ALERTE','Alerte '+id+' → '+st)})}
function sendMsg(e){e.preventDefault();const t=e.target.m.value.trim();go(()=>{S.msg=t;log('ORIENTATION','Message national aux régions : '+t)})}

/* ---------- Agrégats (données validées par le serveur uniquement) ---------- */
function agg(){const P=S.P.filter(p=>p.srv).map(p=>p.srv);
 const sum=(f)=>P.reduce((s,p)=>s+(f(p)||0),0);
 const by={};CUL.forEach(c=>by[c]={n:0,hp:0,kg:0});
 P.forEach(p=>{const b=by[p.c];b.n++;b.hp+=p.hp;b.kg+=p.kg||0});
 return{n:P.length,hp:sum(p=>p.hp),hr:sum(p=>p.hr),e:sum(p=>p.e),l:sum(p=>p.l),kg:sum(p=>p.kg),by,
  lots:S.L.filter(l=>l.srv).length,mv:S.L.filter(l=>l.srv).reduce((s,l)=>s+l.srv.mv.length,0)}}
const kp=(v,l)=>`<div class="kpi"><b>${v}</b><span>${l}</span></div>`;
const pname=id=>(S.P.find(p=>p.id==id)||{nom:'?'}).nom;
const stCls=s=>s=='Vérifiée'?'':s=='À corriger'?' r':' w';

/* ---------- Vues ---------- */
const V={};
V.login=()=>`<section class="card login"><h2>Connexion</h2><p>Accès réservé aux agents et responsables habilités. Chaque connexion est journalisée.</p>
 <form onsubmit="login(event)"><div><label for="u">Identifiant</label><input id="u" name="u" autocomplete="username" required></div>
 <div><label for="p">Mot de passe</label><input id="p" name="p" type="password" autocomplete="current-password" required></div>
 <div class="row"><button>Se connecter</button></div></form>
 <h3>Comptes de démonstration (mot de passe : Faso2026)</h3><div class="row">${USERS.map(u=>`<button class="alt sm" type="button" onclick="fill('${u.id}')">${u.name}</button>`).join('')}</div></section>`;
V.collecte=()=>{const pj=S.A.filter(a=>a.st=='Justification demandée'&&mine().some(p=>p.id==a.pid));
 return `${S.msg?`<p class="note"><b>Orientation nationale :</b> ${esc(S.msg)}</p>`:''}
 <p class="note"><b>Zone affectée :</b> Hauts-Bassins › ${prov(cur().zone)} › ${cur().zone}. Terminal ${S.online?'connecté':'hors-ligne'} · <b>${pend()}</b> enregistrement(s) en attente de synchronisation.</p>
 ${pj.map(a=>`<div class="card"><h2>Justification demandée</h2><p>${esc(pname(a.pid))} : ${esc(a.msg)}</p>
  <label for="j${a.id}">Votre justification</label><textarea id="j${a.id}" rows="2"></textarea>
  <div class="row"><button type="button" onclick="justify('${a.id}')">Envoyer la justification</button></div></div>`).join('')}
 <section class="card"><h2>Recenser un producteur</h2>
 <form class="grid" onsubmit="addProd(event)">
  <div><label>Nom</label><input name="nom" required></div>
  <div><label>Village</label><select name="v">${TERR[prov(cur().zone)][cur().zone].map(x=>`<option>${x}</option>`).join('')}</select></div>

function alloue(){const st=+$('#stk').value;if(!(st>0)){toast('Indiquez le stock d’engrais disponible (kg).');return}
 const ok=S.P.filter(p=>p.srv&&!held(p)),bes=ok.reduce((x,p)=>x+p.srv.e,0);if(!bes){toast('Aucun besoin validé pour le moment.');return}
 const t=Math.min(1,st/bes);
 go(()=>{S.stock=st;S.P.forEach(p=>{if(p.srv){p.al=held(p)?0:Math.round(p.srv.e*t);if(!p.code)p.code=String(1000+Math.floor(Math.random()*9000));hist(p,'ALLOCATION',fmt(p.al)+' kg alloués')}});
  log('ALLOCATION','Stock de '+fmt(st)+' kg pour un besoin validé de '+fmt(bes)+' kg : couverture '+Math.round(t*100)+' %')});}
function remet(id){const p=S.P.find(x=>x.id==id),q=+$('#q'+id).value;
 if($('#c'+id).value.trim()!=p.code){toast('Code de confirmation du producteur incorrect.');return}
 if(!(q>0)||q>p.al-p.di){toast('Quantité invalide : '+fmt(p.al-p.di)+' kg restent à remettre.');return}
 go(()=>{p.di+=q;hist(p,'DISTRIBUTION',fmt(q)+' kg remis, confirmés par le producteur');log('DISTRIBUTION',p.nom+' : '+fmt(q)+' kg remis et confirmés')})}
function sel(id){go(()=>S.sel=id)}

 return `<section class="card"><h2>Répartition territoriale</h2><p>Hauts-Bassins › province › commune › village. Villages de démonstration, à remplacer par le référentiel officiel.</p>
